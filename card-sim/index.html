<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Simulator</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #f4f4f4;
        color: #222;
        padding: 1rem;
      }

      h1 {
        margin-bottom: 1.5rem;
        font-size: 1.4rem;
      }

      .layout {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }

      .controls {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1.25rem;
        min-width: 280px;
        width: 280px;
      }

      .controls h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 0.75rem;
      }

      .controls section + section {
        margin-top: 1.25rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.6rem;
      }

      .field label {
        font-size: 0.8rem;
        color: #555;
        margin-bottom: 0.2rem;
      }

      .field input[type='text'],
      .field select {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
        font-size: 0.9rem;
        width: 100%;
      }

      .field input[type='text']:focus,
      .field select:focus {
        outline: none;
        border-color: #5b8dee;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.8rem;
        color: #555;
        margin-bottom: 0.6rem;
      }

      .field-note {
        font-size: 0.72rem;
        color: #999;
        line-height: 1.35;
        margin: -0.2rem 0 0.6rem;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .slider-row input[type='range'] {
        flex: 1;
      }

      .slider-val {
        font-size: 0.9rem;
        min-width: 2.5rem;
        text-align: right;
      }

      .results {
        flex: 1;
        min-width: 0;
      }

      button {
        padding: 0.5rem 1.25rem;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 0.9rem;
        cursor: pointer;
      }

      button:hover {
        background: #43a047;
      }

      button.secondary {
        background: #5b8dee;
      }

      button.secondary:hover {
        background: #4a7ad6;
      }

      button.ghost {
        background: #fff;
        color: #555;
        border: 1px solid #ccc;
      }

      button.ghost:hover {
        background: #f0f0f0;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .controls .button-row button {
        flex: 1;
      }

      /* ---------- info panel ---------- */

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 0.6rem;
        margin-bottom: 1rem;
      }

      .stat {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
      }

      .stat .k {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
      }

      .stat .v {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 0.15rem;
      }

      .stat .sub {
        font-size: 0.7rem;
        color: #999;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.4rem;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
        margin-bottom: 1rem;
        font-size: 0.8rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .legend-key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }

      .legend-label {
        font-weight: 600;
      }

      .legend-count,
      .legend-total {
        color: #999;
      }

      .legend-total {
        margin-left: auto;
      }

      .panel {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .panel h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 0.75rem;
      }

      /* ---------- players ---------- */

      .players {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .player {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.9rem;
      }

      .player.active {
        border-color: #4caf50;
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.18);
      }

      .player-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.7rem;
      }

      .player-name {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .player.active .player-name::after {
        content: ' \25B6';
        color: #4caf50;
      }

      .player .player-name.plain::after {
        content: none;
      }

      .players.shared {
        grid-template-columns: 1fr;
      }

      .seat-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .seat {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fafafa;
        padding: 0.4rem 0.6rem;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .seat-top {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
      }

      .seat .health {
        margin-bottom: 0;
      }

      .seat.active {
        border-color: #4caf50;
        background: #f1f9f1;
      }

      .seat.active .seat-top::before {
        content: '\25B6';
        color: #4caf50;
        font-size: 0.65rem;
      }

      .seat em {
        font-style: normal;
        font-weight: 400;
        font-size: 0.75rem;
        color: #999;
      }

      .player-meta {
        font-size: 0.75rem;
        color: #999;
      }

      .hand {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .card {
        position: relative;
        flex: 1 1 130px;
        min-width: 120px;
        border: 1px solid #ddd;
        border-left: 4px solid #bbb;
        border-radius: 5px;
        padding: 0.45rem 0.55rem;
        background: #fafafa;
      }

      .card .cn {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .card .ce {
        font-size: 0.7rem;
        color: #888;
        margin-top: 0.2rem;
        line-height: 1.2;
      }

      .card.t-action {
        border-left-color: #3b7dd8;
      }
      .card.t-relic {
        border-left-color: #8a5cd6;
      }
      .card.t-event {
        border-left-color: #d9694a;
      }

      .card.selectable {
        cursor: pointer;
      }

      .card.selectable:hover {
        border-color: #999;
        background: #fff;
      }

      .card.selected,
      .card.selected:hover {
        background: #eaf1fd;
        border-color: #5b8dee;
        box-shadow: 0 0 0 2px rgba(91, 141, 238, 0.25);
      }

      .players.discarding .card.selectable:hover {
        border-color: #d9694a;
      }

      .players.discarding .card.selected,
      .players.discarding .card.selected:hover {
        background: #fdecea;
        border-color: #d9694a;
        box-shadow: 0 0 0 2px rgba(217, 105, 74, 0.25);
      }

      /* ---------- player health ---------- */

      .health {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.65rem;
      }

      .health-pips {
        display: flex;
        gap: 2px;
      }

      .hpip {
        width: 10px;
        height: 6px;
        border-radius: 2px;
        background: #e6e6e6;
      }

      .hpip.on {
        background: #4caf50;
      }

      .health.hp-3 .hpip.on {
        background: #8bc34a;
      }
      .health.hp-2 .hpip.on {
        background: #e8a33d;
      }
      .health.hp-1 .hpip.on {
        background: #d9694a;
      }

      .health-hp {
        font-size: 0.7rem;
        color: #888;
        font-variant-numeric: tabular-nums;
      }

      .health.down .health-hp {
        color: #b5452a;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* ---------- bridge ---------- */

      .bridge-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.75rem;
      }

      .bridge-hp {
        font-size: 0.78rem;
        color: #888;
      }

      .bridge-row {
        display: flex;
        gap: 0.5rem;
      }

      .seg {
        flex: 1;
        min-width: 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fafafa;
        padding: 0.55rem 0.4rem;
        text-align: center;
      }

      .seg-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
      }

      .pips {
        display: flex;
        justify-content: center;
        gap: 3px;
        margin: 0.35rem 0 0.3rem;
      }

      .pip {
        flex: 1;
        max-width: 16px;
        height: 8px;
        border-radius: 2px;
        background: #e6e6e6;
      }

      .pip.on {
        background: #4caf50;
      }

      .seg.hp-3 .pip.on {
        background: #8bc34a;
      }
      .seg.hp-2 .pip.on {
        background: #e8a33d;
      }
      .seg.hp-1 .pip.on {
        background: #d9694a;
      }

      .seg.hp-1 {
        border-color: #e9b3a3;
        background: #fdf3f0;
      }

      .seg.broken {
        border-color: #b5452a;
        background: #fbe4de;
      }

      .seg-hp {
        font-size: 0.75rem;
        font-weight: 600;
      }

      .seg.broken .seg-hp {
        color: #b5452a;
      }

      .seg-risk {
        font-size: 0.65rem;
        color: #aaa;
        margin-top: 0.15rem;
      }

      .seg.targetable {
        cursor: pointer;
      }

      .seg.targetable:hover {
        border-color: #d9694a;
        box-shadow: 0 0 0 2px rgba(217, 105, 74, 0.2);
      }

      /* ---------- forecast ---------- */

      .forecast {
        margin-top: 1rem;
        padding-top: 0.9rem;
        border-top: 1px solid #eee;
        font-size: 0.8rem;
      }

      .forecast h4 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .forecast-line {
        color: #666;
        margin-bottom: 0.5rem;
        line-height: 1.5;
      }

      .forecast-line b {
        color: #222;
      }

      .hist {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 40px;
      }

      .hist-bar {
        flex: 1;
        min-height: 1px;
        border-radius: 2px 2px 0 0;
        background: #d9694a;
        opacity: 0.7;
      }

      .hist-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 0.25rem;
        font-size: 0.65rem;
        color: #aaa;
      }

      .broken-banner {
        margin-bottom: 1rem;
        padding: 0.85rem 1rem;
        border: 1px solid #e9b3a3;
        border-radius: 8px;
        background: #fbe4de;
        color: #8f3520;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .broken-banner span {
        display: block;
        margin-top: 0.2rem;
        font-weight: 400;
        font-size: 0.8rem;
        color: #a2543c;
      }

      .turn-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .turn-bar-text {
        flex: 1;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .turn-bar button {
        padding: 0.4rem 1rem;
        font-size: 0.85rem;
      }

      .turn-bar.discarding {
        background: #fef7f5;
        border-color: #f0c4b8;
      }

      .turn-bar.discarding .turn-bar-text {
        color: #b5452a;
      }

      .turn-bar button.danger {
        background: #d9694a;
      }

      .turn-bar button.danger:hover {
        background: #c85b3d;
      }

      .card.fresh {
        background: #f1f9f1;
        border-color: #bfe3c0;
        border-left-color: #4caf50;
      }

      .card-tag {
        position: absolute;
        top: 0.35rem;
        right: 0.4rem;
        padding: 0.1rem 0.25rem;
        border-radius: 3px;
        background: #e3f3e4;
        color: #3d8b40;
        font-size: 0.6rem;
        font-weight: 600;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .card.fresh .cn {
        padding-right: 3.2rem;
      }

      .empty-hand {
        font-size: 0.78rem;
        color: #bbb;
        font-style: italic;
      }

      /* ---------- log ---------- */

      #log {
        max-height: 260px;
        overflow-y: auto;
        font-size: 0.8rem;
      }

      .log-entry {
        padding: 0.4rem 0;
        border-bottom: 1px solid #f0f0f0;
        line-height: 1.45;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-turn {
        display: inline-block;
        min-width: 3.2rem;
        color: #aaa;
        font-variant-numeric: tabular-nums;
      }

      .log-who {
        font-weight: 600;
      }

      .log-play {
        color: #3b7dd8;
      }
      .log-discard {
        color: #d9694a;
      }
      .log-event,
      .log-bridge {
        color: #b5452a;
        font-weight: 600;
      }
      .log-strain {
        color: #b07818;
        font-weight: 600;
      }
      .log-heal {
        color: #3d8b40;
        font-weight: 600;
      }
      .log-draw {
        color: #4caf50;
      }
      .log-note {
        color: #999;
        font-style: italic;
      }

      /* ---------- tables ---------- */

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        font-size: 0.85rem;
      }

      thead {
        background: #f0f0f0;
      }

      th,
      td {
        padding: 0.45rem 0.7rem;
        text-align: left;
        border-bottom: 1px solid #eee;
      }

      th {
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #666;
      }

      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tr:hover td {
        background: #fafafa;
      }

      td .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 0.45rem;
        vertical-align: baseline;
      }

      .zero {
        color: #ccc;
      }

      @media (max-width: 700px) {
        .layout {
          flex-direction: column;
        }

        .controls {
          width: 100%;
          min-width: unset;
        }
      }
    </style>
  </head>
  <body>
    <h1>Card Simulator</h1>

    <div class="layout">
      <div class="controls">
        <section>
          <h3>Table</h3>
          <div class="field">
            <label>Players</label>
            <div class="slider-row">
              <input type="range" id="players" min="2" max="8" value="4" />
              <span class="slider-val" id="players-val">4</span>
            </div>
          </div>
          <div class="field">
            <label>Hands</label>
            <select id="hand-mode">
              <option value="individual">Individual hands</option>
              <option value="shared">One shared hand</option>
            </select>
          </div>
          <div class="field">
            <label id="hand-size-label">Hand size</label>
            <div class="slider-row">
              <input type="range" id="hand-size" min="1" max="10" value="4" />
              <span class="slider-val" id="hand-size-val">4</span>
            </div>
          </div>
        </section>

        <section>
          <h3>Players</h3>
          <div class="field">
            <label>Starting strength</label>
            <div class="slider-row">
              <input type="range" id="start-health" min="1" max="10" value="5" />
              <span class="slider-val" id="start-health-val">5</span>
            </div>
          </div>
          <div class="field-note" id="health-note"></div>
        </section>

        <section>
          <h3>Bridge</h3>
          <div class="field">
            <label>Rope health per segment</label>
            <div class="slider-row">
              <input type="range" id="segment-hp" min="2" max="6" value="4" />
              <span class="slider-val" id="segment-hp-val">4</span>
            </div>
          </div>
          <div class="field-note" id="bridge-note"></div>
        </section>

        <section>
          <h3>Deck</h3>
          <div class="field">
            <label>Bridge Weakens cards</label>
            <div class="slider-row">
              <input type="range" id="bridge-weakens" min="0" max="12" value="6" />
              <span class="slider-val" id="bridge-weakens-val">6</span>
            </div>
          </div>
          <div class="field">
            <label>Strength Test cards</label>
            <div class="slider-row">
              <input type="range" id="strength-test" min="0" max="12" value="4" />
              <span class="slider-val" id="strength-test-val">4</span>
            </div>
          </div>
          <div class="field-note" id="deck-note"></div>
        </section>

        <section>
          <h3>Turn Rules</h3>
          <div class="field">
            <label>Turn control</label>
            <select id="turn-mode">
              <option value="random">Random (auto-player)</option>
              <option value="manual">Manual (pick cards)</option>
            </select>
          </div>
          <div class="field">
            <label>Cards played per turn (min)</label>
            <div class="slider-row">
              <input type="range" id="play-min" min="0" max="5" value="0" />
              <span class="slider-val" id="play-min-val">0</span>
            </div>
          </div>
          <div class="field">
            <label>Cards played per turn (max)</label>
            <div class="slider-row">
              <input type="range" id="play-max" min="0" max="5" value="2" />
              <span class="slider-val" id="play-max-val">2</span>
            </div>
          </div>
          <div class="field-note" id="discard-note"></div>
          <div class="field">
            <label>Auto-player cuts the ropes at</label>
            <select id="cut-policy">
              <option value="random">A random segment</option>
              <option value="weakest">The weakest segment</option>
              <option value="strongest">The strongest segment</option>
            </select>
          </div>
          <div class="field">
            <label>Played cards go to</label>
            <select id="played-dest">
              <option value="discard">Discard pile</option>
              <option value="removed">Out of play</option>
            </select>
          </div>
        </section>

        <section>
          <h3>Playback</h3>
          <div class="field">
            <label>Auto-play speed</label>
            <div class="slider-row">
              <input type="range" id="speed" min="100" max="2000" step="100" value="700" />
              <span class="slider-val" id="speed-val">700ms</span>
            </div>
          </div>
        </section>

        <div class="button-row">
          <button id="new-game">Start Game</button>
        </div>
        <div class="button-row">
          <button id="next-turn" class="secondary">Next Turn</button>
          <button id="auto" class="ghost">Auto</button>
        </div>
        <div class="button-row">
          <button id="skip" class="ghost">Skip 10</button>
          <button id="save-btn" class="ghost">Save Log</button>
        </div>
      </div>

      <div class="results">
        <div class="stat-grid" id="stats"></div>

        <div class="legend" id="legend"></div>

        <div id="broken-banner"></div>

        <div class="panel" id="bridge"></div>

        <div id="turn-bar"></div>

        <div class="players" id="players-view"></div>

        <div class="panel">
          <h3>Turn Log</h3>
          <div id="log"></div>
        </div>

        <div class="panel">
          <h3>Card Tracker</h3>
          <table id="tracker"></table>
        </div>
      </div>
    </div>

    <script src="cards.js"></script>
  </body>
</html>
